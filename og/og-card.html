<!doctype html>
<!--
  Source for the 1200x630 share card. Not part of the app bundle.

  Capture with (from the repo root):

  CH=~/Library/Caches/ms-playwright/chromium_headless_shell-1234/chrome-headless-shell-mac-arm64/chrome-headless-shell
  "$CH" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
        --window-size=1200,630 --screenshot=public/og-card.png \
        "file://$PWD/og/og-card.html"

  Any Chrome/Chromium binary works; that path is just the one available here.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NORA AI — share card</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --border: rgba(255, 255, 255, 0.08);
        --text: #ffffff;
        --text-muted: #a1a1a1;
        --text-dim: #6b6b6b;
        --accent: #9b5de5;
        --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        font-family: var(--font-sans);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Violet bloom behind the headline */
      .glow {
        position: absolute;
        top: -280px;
        left: 50%;
        transform: translateX(-50%);
        width: 1100px;
        height: 700px;
        background: radial-gradient(
          ellipse at center,
          rgba(155, 93, 229, 0.22) 0%,
          transparent 68%
        );
      }

      .top {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 40px 56px 0;
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .dot {
        width: 10px;
        height: 10px;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
      }

      .wordmark .ai { color: var(--accent); margin-left: 0.28em; }

      .mono {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .body {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 56px;
      }

      h1 {
        font-size: 82px;
        line-height: 1.0;
        font-weight: 600;
        letter-spacing: -0.035em;
        max-width: 15ch;
        background: linear-gradient(180deg, #ffffff 34%, #b9b2c4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sub {
        margin-top: 26px;
        font-size: 25px;
        line-height: 1.4;
        color: var(--text-muted);
        /* Wide enough to keep this on a single line — a "… testing for /
           students" break reads badly at thumbnail size. */
        max-width: 880px;
      }

      /* --- Mosaic + timeline strip along the bottom --- */

      .strip {
        position: relative;
        height: 176px;
        border-top: 1px solid var(--border);
        overflow: hidden;
        background: #060606;
        flex-shrink: 0;
      }

      .strip img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        image-rendering: pixelated;
        filter: grayscale(0.78) brightness(0.55) contrast(1.35);
        opacity: 0.5;
      }

      .tint {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          160deg,
          rgba(155, 93, 229, 0.3) 0%,
          transparent 55%
        );
        mix-blend-mode: screen;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
            to right,
            rgba(255, 255, 255, 0.05) 0 1px,
            transparent 1px calc(100% / 28)
          ),
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.05) 0 1px,
            transparent 1px calc(100% / 16)
          );
      }

      .fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(10, 10, 10, 0.55) 0%,
          transparent 40%,
          rgba(10, 10, 10, 0.9) 100%
        );
      }

      .region {
        position: absolute;
        left: 44%;
        top: 16%;
        width: 15%;
        height: 40%;
        border: 1px solid var(--accent);
        box-shadow: 0 0 40px rgba(155, 93, 229, 0.4);
      }

      .region-label {
        position: absolute;
        bottom: calc(100% + 6px);
        left: -1px;
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: var(--accent);
        padding: 3px 7px;
      }

      .ticks {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 26px;
        display: grid;
        grid-template-columns: repeat(51, 1fr);
        gap: 3px;
        height: 26px;
      }

      .tick { background: rgba(255, 255, 255, 0.14); border-radius: 1px; }

      .tick.on {
        background: var(--accent);
        box-shadow: 0 0 14px rgba(155, 93, 229, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="top">
      <span class="wordmark">
        <span class="dot"></span>NORA<span class="ai">AI</span>
      </span>
      <span class="mono">Data for Good Challenge</span>
    </div>

    <div class="body">
      <h1>How surgical review should be</h1>
      <p class="sub">
        Frame by frame error-annotation and testing for students
      </p>
    </div>

    <div class="strip">
      <img src="../public/mosaic.png" alt="" />
      <div class="tint"></div>
      <div class="grid"></div>
      <div class="fade"></div>
      <div class="region">
        <span class="region-label">Suture tension too high</span>
      </div>
      <div class="ticks" id="ticks"></div>
    </div>

    <script>
      // 51 frames starting at 734; the four ranges come from
      // src/assets/json-files/dummy-file.json
      const RANGES = [
        [740, 745],
        [755, 760],
        [768, 773],
        [776, 780],
      ];
      const ticks = document.getElementById("ticks");
      for (let i = 0; i < 51; i++) {
        const frame = 734 + i;
        const on = RANGES.some(([s, e]) => frame >= s && frame <= e);
        const el = document.createElement("span");
        el.className = on ? "tick on" : "tick";
        ticks.appendChild(el);
      }
    </script>
  </body>
</html>
